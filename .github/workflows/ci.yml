name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: turnos # Credencial ficticia, solo contenedor efímero de CI.
          POSTGRES_DB: turnos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnos -d turnos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://turnos:turnos@127.0.0.1:5432/turnos_test
      TEST_DATABASE_URL: postgresql+asyncpg://turnos:turnos@127.0.0.1:5432/turnos_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./backend[dev]"
      - run: ruff check backend
        working-directory: .
      - run: ruff format --check backend/app backend/tests
        working-directory: .
      - run: alembic upgrade head
        working-directory: ./backend
      - run: pytest tests -q
        working-directory: ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npx tsc --noEmit
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend
      - run: npm test
        working-directory: ./frontend
      - run: npx playwright install --with-deps chromium
        working-directory: ./frontend
      - run: npm run test:e2e
        working-directory: ./frontend

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST_PORT: 55432
      REDIS_HOST_PORT: 56379
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verify application and migration state
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/health
          curl --fail --silent --show-error http://localhost:4173/manifest.webmanifest
          docker compose exec -T api alembic current --check-heads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npx playwright install --with-deps chromium
        working-directory: ./frontend
      - name: Check patient session against Compose
        run: npm run test:e2e -- real-backend.spec.ts
        working-directory: ./frontend
        env:
          E2E_REAL_BACKEND: "1"
          E2E_USE_EXISTING_FRONTEND: "1"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
